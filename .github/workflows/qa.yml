# Проверяет исходный SHA PR; ожидаемые дефекты buggy подтверждает ci/verify.py, а не xfail.
name: Проверка учебного стенда
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt -c requirements-test.lock
      - run: python -m playwright install --with-deps chromium
      - run: python ci/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: artifacts/
          retention-days: 30
