# Публикует утверждённый манифест только после появления неизменяемого тега выпуска.
name: Публикация выпуска

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Проверить манифест
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/validate_release.py --version "$RELEASE_VERSION"
      - name: Собрать артефакты выпуска
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/package_release.py --version "$RELEASE_VERSION" --output release-package
      - name: Создать или обновить выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          title="Учебный выпуск ${RELEASE_VERSION}"
          notes_file="releases/${RELEASE_VERSION}.md"
          test -f "$notes_file"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_VERSION" --verify-tag --title "$title" --notes-file "$notes_file"
          fi
          gh release upload "$RELEASE_VERSION" release-package/* --clobber
