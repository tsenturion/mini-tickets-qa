# Shell-агент запускается на хосте Docker; отдельная venv не меняет глобальные пакеты.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
stages: [test]
verify:
  stage: test
  tags: [qa-docker]
  timeout: 25m
  script:
    - python ci/bootstrap.py
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/]
    reports:
      junit: artifacts/*/tests.xml
