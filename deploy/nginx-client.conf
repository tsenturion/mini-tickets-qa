# Допустимый внешний X-Request-ID сохраняется, для остальных запросов Nginx
# создаёт собственный идентификатор и передаёт его FastAPI.
map $http_x_request_id $lab_request_id {
    "~^[a-zA-Z0-9_-]{1,64}$" $http_x_request_id;
    default $request_id;
}

# Access log содержит только диагностические координаты и длительности. Тела,
# query string, Authorization, Cookie, адрес клиента и User-Agent не записываются.
log_format lab_json escape=json
    '{"time":"$time_iso8601","service":"nginx","event":"HTTP-запрос",'
    '"request_id":"$lab_request_id","method":"$request_method","path":"$uri",'
    '"status":$status,"request_time_seconds":$request_time,'
    '"upstream_response_time_seconds":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent}';

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /dev/stdout lab_json;
    error_log /dev/stderr warn;
    location /api/ { proxy_pass http://app:8000; proxy_set_header X-Request-ID $lab_request_id; }
    location /health/ { proxy_pass http://app:8000; }
    location = /docs { proxy_pass http://app:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
