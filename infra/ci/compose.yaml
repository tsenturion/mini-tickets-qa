# Отдельная инфраструктура преподавателя. Для работы самого приложения не нужна.
# Именованные тома сохраняют репозитории, настройки и историю после перезапуска.
name: mini-tickets-ci
services:
  gitlab:
    image: gitlab/gitlab-ce:19.3.1-ce.0@sha256:f63df4c43029fe91db370609c0b40a1e3585cebd06e3e9637d93a9a3030eb86e
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 8929
        gitlab_rails['gitlab_shell_ssh_port'] = 2229
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        logging['logrotate_frequency'] = 'daily'
        logging['logrotate_rotate'] = 30
        logging['svlogd_timeout'] = 86400
        logging['svlogd_num'] = 30
    ports:
      - 127.0.0.1:8929:8929
      - 127.0.0.1:2229:22
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8929/-/readiness]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
  jenkins:
    image: jenkins/jenkins:2.568.2-jdk21@sha256:8547df3b0db2803d158ecc9499207a056bb30c23fddc18bb5b4a4dc14e77dd09
    # Docker socket контроллеру не даём. Сборки выполняет отдельный Windows-агент.
    ports:
      - 127.0.0.1:8085:8080
    volumes:
      - jenkins_home:/var/jenkins_home
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  jenkins_home:
