workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
stages: [test]
grade:
  stage: test
  tags: [qa-docker]
  timeout: 1h
  script:
    - python ci_grade.py
  artifacts:
    when: always
    expire_in: 30 days
    paths: [product/artifacts/]

