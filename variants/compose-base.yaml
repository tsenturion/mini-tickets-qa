# Основа вариантов: LAB_PROJECT разделяет сети/тома, healthcheck подтверждает готовность до тестов.
name: ${LAB_PROJECT:-mini-tickets}
services:
  db:
    image: postgres:16@sha256:b6ccf02e9b47eac0d67b5eaa0ef56fd59163bffa5506f64e96ceb5053130ec86
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab-local-only}
    ports:
      - "127.0.0.1:${LAB_DB_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lab:${LAB_DB_PASSWORD:-lab-local-only}@db:5432/lab
      LOG_DIR: /app/logs
      SERVICE: all
    ports:
      - "127.0.0.1:${LAB_PORT:-8000}:8000"
    volumes:
      - logs:/app/logs
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 40
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
volumes:
  database:
  logs:
