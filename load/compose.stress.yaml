# Дополнение к compose.yaml монолита: отдельный namespace и порты задаются при запуске.
# Долю CPU уменьшаем одинаково для всех ступеней, чтобы увидеть перегрузку малым
# числом клиентов. Результаты относятся к этой учебной конфигурации, а не к обычной среде.
services:
  app:
    image: mini-tickets-stress-app:local
    cpus: "0.20"
    # Проверка пароля занимает память у каждого параллельного входа. Здесь цель —
    # наблюдать задержку при ограничении CPU, сохраняя запас памяти для небольшого прогона.
    mem_limit: 768m
    memswap_limit: 768m
  db:
    cpus: "0.50"
    mem_limit: 256m
    memswap_limit: 256m
