# Вариант microservices-buggy: LAB_PROJECT разделяет данные; готовность сервисов проверяется до запуска тестов.
name: ${LAB_PROJECT:-mini-tickets}
services:
  db:
    image: postgres:16@sha256:b6ccf02e9b47eac0d67b5eaa0ef56fd59163bffa5506f64e96ceb5053130ec86
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab-local-only}
    ports:
    - 127.0.0.1:${LAB_DB_PORT:-55432}:5432
    volumes:
    - database:/var/lib/postgresql/data
    - ./deploy/init-micro.sh:/docker-entrypoint-initdb.d/01-micro.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lab -d lab
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_DEFECTS: ${LAB_DEFECTS:-all}
    ports:
    - 127.0.0.1:${LAB_PORT:-8000}:80
    depends_on:
      identity:
        condition: service_healthy
      tickets:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1/health/ready
      interval: 3s
      timeout: 5s
      retries: 40
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
  identity:
    build:
      context: .
      args:
        VITE_DEFECTS: ${LAB_DEFECTS:-all}
    environment:
      DATABASE_URL: postgresql+psycopg://identity:identity-local-only@db:5432/identity
      LOG_DIR: /app/logs/identity
      SERVICE: identity
      LAB_DEFECTS: ${LAB_DEFECTS:-all}
    volumes:
    - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=2)
      interval: 3s
      timeout: 5s
      retries: 40
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
  tickets:
    build:
      context: .
      args:
        VITE_DEFECTS: ${LAB_DEFECTS:-all}
    environment:
      DATABASE_URL: postgresql+psycopg://tickets:tickets-local-only@db:5432/tickets
      LOG_DIR: /app/logs/tickets
      SERVICE: tickets
      LAB_DEFECTS: ${LAB_DEFECTS:-all}
      IDENTITY_URL: http://identity:8000
    volumes:
    - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=2)
      interval: 3s
      timeout: 5s
      retries: 40
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
volumes:
  database: null
  logs: null
